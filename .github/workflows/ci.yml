name: Manifest CI

on:
  push:
    paths:
      - "manifests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "manifests/**"
      - ".github/workflows/ci.yml"

jobs:
  validate-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for merge conflict markers
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' manifests; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

      - name: Validate YAML syntax
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          path = Path("manifests/deployment.yaml")
          docs = list(yaml.safe_load_all(path.read_text()))
          assert len(docs) == 2, "deployment.yaml must contain Deployment and Service"
          assert docs[0]["kind"] == "Deployment", "first document must be a Deployment"
          assert docs[1]["kind"] == "Service", "second document must be a Service"
          PY

      - name: Validate allowed image tags
        run: |
          IMAGE_LINE=$(grep 'image:' manifests/deployment.yaml | head -1 | xargs)
          echo "Found image line: $IMAGE_LINE"
          case "$IMAGE_LINE" in
            "image: wil42/playground:v1"|"image: wil42/playground:v2")
              echo "Image tag is valid."
              ;;
            *)
              echo "Only wil42/playground:v1 or wil42/playground:v2 are allowed."
              exit 1
              ;;
          esac
