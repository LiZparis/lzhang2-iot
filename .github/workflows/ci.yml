name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("manifests/deployment.yaml")
          if not path.exists():
              raise SystemExit("manifests/deployment.yaml not found")

          docs = list(yaml.safe_load_all(path.read_text()))
          image = docs[0]["spec"]["template"]["spec"]["containers"][0]["image"]

          if image not in {
              "wil42/playground:v1",
              "wil42/playground:v2",
          }:
              raise SystemExit("Only v1 and v2 are allowed")
          PY
